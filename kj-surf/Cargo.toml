[package]
name = "kj-surf"
description = "KJ Surf — browser orisinil berbasis Gecko engine, dibangun dengan Rust + egui + WASM"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "kj-surf"
path = "src/main.rs"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "ImageData", "KeyboardEvent", "MouseEvent",
  "WheelEvent", "HtmlInputElement", "HtmlButtonElement", "CssStyleDeclaration",
  "DomRect", "Navigator", "Location", "History", "Storage",
  "WebSocket", "MessageEvent", "CloseEvent", "BinaryType",
  "Request", "RequestInit", "Response", "Headers",
  "Blob", "Url", "Performance",
  "console"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-utils = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM-specific deps (same as wordcraft-web)

console_error_panic_hook = "0.1"
