[package]
name = "kj-surf"
description = "KJ Surf — browser orisinil berbasis Gecko engine, Rust + egui + WASM"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "kj-surf"
path = "src/main.rs"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
