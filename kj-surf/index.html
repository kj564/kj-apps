<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>KJ Surf</title>
  <link data-trunk rel="icon" href="icon.png" />
  <link data-trunk rel="rust" data-bin="kj-surf" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #1a1a2e;
    }
    #kj_surf_canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%; display: block;
    }
    #kj_surf_loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e4e4e4; font: 14px system-ui, sans-serif;
      pointer-events: none;
      background: #1a1a2e;
    }
    #kj_surf_loading .logo {
      width: 64px; height: 64px;
      margin-bottom: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0f3460, #e94560);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
  </style>
</head>
<body>
  <canvas id="kj_surf_canvas"></canvas>
  <div id="kj_surf_loading">
    <div class="logo">🌐</div>
    <div>Loading KJ Surf…</div>
  </div>
</body>
</html>
